<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · App Template</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #000;
        color: #fff;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin: 16px 0 8px;
      }
      p {
        color: #a3a3a3;
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        padding: 12px 24px;
        border-radius: 9999px;
        border: 0;
        background: #fff;
        color: #000;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Check your connection and try again. Cached pages you've already visited will still work.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
